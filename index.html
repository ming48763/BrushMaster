<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動式題庫測驗系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        
        .quiz-container { 
            max-width: 800px; 
            margin: 15px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
        }
        @media (min-width: 768px) {
            .quiz-container { margin: 40px auto; padding: 40px; }
        }

        .question-block { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px dashed #f1f3f5; }
        .question-block:last-child { border-bottom: none; }
        
        .correct-ans { color: #198754; font-weight: bold; }
        .wrong-ans { color: #dc3545; font-weight: bold; }
        .topic-row { background-color: #f1f3f5; padding: 15px; border-radius: 10px; margin-bottom: 12px; }
        
        /* 隱藏數字輸入框的上下箭頭 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* 選項按鈕設計 */
        .option-block {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 2px solid #e9ecef;
            background-color: #fff;
        }
        .option-block:hover { background-color: #f8f9fa; border-color: #dee2e6; }
        
        .form-check-input:checked + .option-text {
            font-weight: bold;
            color: #0d6efd;
        }
        .option-block:has(.form-check-input:checked) {
            border-color: #0d6efd;
            background-color: #f0f8ff;
        }

        /* 頁籤的美化 */
        .nav-pills .nav-link { color: #6c757d; border-radius: 50rem; margin: 0 5px; font-weight: bold; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: white; box-shadow: 0 4px 6px rgba(13, 110, 253, 0.2); }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2 class="text-center mb-4 fw-bold">📝 題庫測驗系統</h2>

    <div id="setup-section">
        
        <ul class="nav nav-pills nav-fill mb-4 border-bottom pb-3" id="quizTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fs-5" id="tab-kh-history" data-bs-toggle="pill" data-bs-target="#kh-history-pane" type="button" role="tab" aria-selected="true">高雄文明史</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fs-5" id="tab-teacher-exam" data-bs-toggle="pill" data-bs-target="#teacher-exam-pane" type="button" role="tab" aria-selected="false">教甄試題</button>
            </li>
        </ul>

        <div class="tab-content mb-4" id="quizTabsContent">
            
            <div class="tab-pane fade show active" id="kh-history-pane" role="tabpanel">
                <label class="form-label fw-bold fs-5 text-dark">1. 選擇文明史主題與範圍：</label>
                <div id="topic-checkboxes">
                    </div>
            </div>

            <div class="tab-pane fade" id="teacher-exam-pane" role="tabpanel">
                <label class="form-label fw-bold fs-5 text-dark">1. 選擇教甄地區與年份：</label>
                <div class="topic-row d-flex flex-column gap-3 shadow-sm">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center w-100">
                        <div class="fw-bold fs-5 mb-2 mb-md-0 text-secondary">📍 指定地區：</div>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check fs-5 mb-0">
                                <input class="form-check-input region-cb border-secondary shadow-sm mt-1" type="checkbox" value="台中" id="region-tc" checked>
                                <label class="form-check-label fw-bold" style="cursor: pointer;" for="region-tc">台中 (臺中)</label>
                            </div>
                            <div class="form-check fs-5 mb-0">
                                <input class="form-check-input region-cb border-secondary shadow-sm mt-1" type="checkbox" value="高雄" id="region-kh" checked>
                                <label class="form-check-label fw-bold" style="cursor: pointer;" for="region-kh">高雄</label>
                            </div>
                            <div class="form-check fs-5 mb-0">
                                <input class="form-check-input region-cb border-secondary shadow-sm mt-1" type="checkbox" value="台南" id="region-tn" checked>
                                <label class="form-check-label fw-bold" style="cursor: pointer;" for="region-tn">台南 (臺南)</label>
                            </div>
                        </div>
                    </div>
                    <hr class="m-0 text-secondary" style="opacity: 0.15;">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center w-100">
                        <div class="fw-bold fs-5 mb-2 mb-md-0 text-secondary">📅 指定年份區間：</div>
                        <div class="input-group flex-nowrap shadow-sm w-100 w-md-auto">
                            <span class="input-group-text bg-white text-muted">民國</span>
                            <input type="number" class="form-control text-center fw-bold text-primary fs-5 px-1" id="year-min" value="109" min="50">
                            <span class="input-group-text bg-white border-start-0 border-end-0 text-muted px-1 px-md-2">至</span>
                            <input type="number" class="form-control text-center fw-bold text-primary fs-5 px-1" id="year-max" value="114" min="50">
                            <span class="input-group-text bg-white text-muted">年</span>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

        <div class="mb-4">
            <label for="limit-input" class="form-label fw-bold fs-5 text-dark">2. 指定測驗題數：</label>
            <input type="number" id="limit-input" class="form-control form-control-lg fw-bold text-primary shadow-sm" style="max-width: 100%;" value="20" min="1">
            <div class="form-text mt-2">預設為 20 題，可自行修改。</div>
        </div>

        <button class="btn btn-primary btn-lg w-100 shadow mt-2 rounded-pill fw-bold" onclick="startQuiz()">🚀 開始測驗</button>
    </div>

    <div id="quiz-section" class="d-none">
        <div id="questions-container"></div>
        <button class="btn btn-success btn-lg w-100 mt-4 shadow rounded-pill fw-bold" onclick="submitQuiz()">💯 交卷算分</button>
    </div>

    <div id="result-section" class="d-none text-center">
        <h3 id="score-display" class="mb-4"></h3>
        <div id="review-container" class="text-start"></div>
        <button class="btn btn-outline-primary btn-lg w-100 mt-4 rounded-pill fw-bold" onclick="location.reload()">🔄 重新設定測驗</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let kaohsiungDB = [];
    let teacherDB = [];
    let currentQuiz = [];
    
    // 1. 網頁載入時，抓取題庫並自動分流
    fetch('questions_db.json')
        .then(response => response.json())
        .then(data => {
            // 自動分類：包含「高雄文明史」的放一邊，剩下的放另一邊
            kaohsiungDB = data.filter(q => q.topic.includes('高雄文明史'));
            teacherDB = data.filter(q => !q.topic.includes('高雄文明史'));

            // === 渲染「高雄文明史」的核選方塊 ===
            const container = document.getElementById('topic-checkboxes');
            const topics = [...new Set(kaohsiungDB.map(q => q.topic))];
            
            topics.forEach((topic, index) => {
                const topicQuestions = kaohsiungDB.filter(q => q.topic === topic);
                const maxId = Math.max(...topicQuestions.map(q => q.id));

                container.innerHTML += `
                    <div class="topic-row d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3 shadow-sm">
                        <div class="form-check fs-5 mb-0 w-100">
                            <input class="form-check-input topic-cb border-secondary shadow-sm mt-1" type="checkbox" value="${topic}" id="cb-${index}">
                            <label class="form-check-label fw-bold d-block" style="cursor: pointer;" for="cb-${index}">
                                ${topic} <span class="text-muted fs-6 d-block d-md-inline">(共 ${topicQuestions.length} 題)</span>
                            </label>
                        </div>
                        <div class="input-group flex-nowrap shadow-sm w-100 w-md-auto">
                            <span class="input-group-text bg-white text-muted">第</span>
                            <input type="number" class="form-control text-center fw-bold text-primary fs-5 px-1" id="min-${index}" value="1" min="1">
                            <span class="input-group-text bg-white border-start-0 border-end-0 text-muted px-1 px-md-2">至</span>
                            <input type="number" class="form-control text-center fw-bold text-primary fs-5 px-1" id="max-${index}" value="${maxId}" min="1">
                            <span class="input-group-text bg-white text-muted">題</span>
                        </div>
                    </div>
                `;
            });
        });

    // 2. 點擊「開始測驗」
    function startQuiz() {
        let questionPool = []; 

        // 判斷目前使用者是在哪一個「頁籤 (Tab)」
        const isKaohsiungMode = document.getElementById('tab-kh-history').classList.contains('active');

        if (isKaohsiungMode) {
            // === 模式 A：高雄文明史篩選邏輯 ===
            const checkboxes = document.querySelectorAll('.topic-cb');
            checkboxes.forEach((cb, index) => {
                if (cb.checked) {
                    const topic = cb.value;
                    let minVal = parseInt(document.getElementById(`min-${index}`).value) || 1;
                    let maxVal = parseInt(document.getElementById(`max-${index}`).value) || 9999;
                    if (minVal > maxVal) [minVal, maxVal] = [maxVal, minVal]; 

                    const filtered = kaohsiungDB.filter(q => q.topic === topic && q.id >= minVal && q.id <= maxVal);
                    questionPool = questionPool.concat(filtered);
                }
            });

            if (questionPool.length === 0) {
                alert("⚠️ 錯誤：請至少勾選一個高雄文明史的測驗範圍！");
                return;
            }
        } else {
            // === 模式 B：教甄試題篩選邏輯 ===
            // 抓取被勾選的地區
            const selectedRegions = Array.from(document.querySelectorAll('.region-cb:checked')).map(cb => cb.value);
            
            // 抓取年份區間
            let minYear = parseInt(document.getElementById('year-min').value) || 0;
            let maxYear = parseInt(document.getElementById('year-max').value) || 9999;
            if (minYear > maxYear) [minYear, maxYear] = [maxYear, minYear];

            if (selectedRegions.length === 0) {
                alert("⚠️ 錯誤：請至少勾選一個教甄地區！");
                return;
            }

            questionPool = teacherDB.filter(q => {
                // 將題目名稱中的「臺」統一轉為「台」，防止因為文字差異而漏抓
                const topicNorm = q.topic.replace(/臺/g, '台');
                const hasRegion = selectedRegions.some(region => topicNorm.includes(region));

                // 提取出處字串中的「第一個數字」作為年份
                const yearMatch = q.topic.match(/\d+/);
                const year = yearMatch ? parseInt(yearMatch[0]) : 0;
                const isYearValid = (year >= minYear && year <= maxYear);

                return hasRegion && isYearValid;
            });

            if (questionPool.length === 0) {
                alert(`⚠️ 錯誤：在民國 ${minYear} 至 ${maxYear} 年間，找不到您勾選地區的試題！\n(請確認年份輸入是否正確)`);
                return;
            }
        }

        // === 共用的題數防呆邏輯 ===
        const limitInput = document.getElementById('limit-input').value;
        const limit = parseInt(limitInput);

        if (isNaN(limit) || limit <= 0) {
            alert("⚠️ 錯誤：請輸入大於 0 的合理測驗題數！");
            return;
        }

        if (limit > questionPool.length) {
            alert(`⚠️ 錯誤：題數不足！\n您設定的篩選條件下只有 ${questionPool.length} 題，但您要求測驗 ${limit} 題。\n請減少測驗題數，或放寬範圍。`);
            return;
        }

        // 打亂題庫並切出考卷
        questionPool.sort(() => Math.random() - 0.5);
        currentQuiz = questionPool.slice(0, limit);

        document.getElementById('setup-section').classList.add('d-none');
        document.getElementById('quiz-section').classList.remove('d-none');

        renderQuestions();
        
        setTimeout(() => { window.scrollTo(0, 0); }, 50); 
    }

    // 3. 渲染題目畫面
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        currentQuiz.forEach((q, index) => {
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label class="form-check d-flex align-items-center p-3 mb-3 rounded-3 option-block shadow-sm" for="q${index}-opt${optIndex}">
                        <input class="form-check-input mt-0 ms-0 me-3 fs-4 border-secondary flex-shrink-0" type="radio" name="q-${index}" value="${opt}" id="q${index}-opt${optIndex}">
                        <span class="option-text fs-5 lh-base">${opt}</span>
                    </label>
                `;
            });

            container.innerHTML += `
                <div class="question-block" id="question-${index}">
                    <h5 class="fw-bold mb-4 lh-base" style="font-size: 1.15rem;">
                        <span class="badge bg-dark me-2 fs-6 mb-1">第 ${index + 1} 題</span><br class="d-md-none">
                        ${q.question}
                    </h5>
                    <div>
                        ${optionsHtml}
                    </div>
                    <div class="text-muted small mt-2 text-end">來源：${q.topic} (原題號：${q.id})</div>
                </div>
            `;
        });
    }

    // ⭐ 新增功能：點擊選項後「精準捲動」到下一題
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('questions-container').addEventListener('change', function(e) {
            if (e.target && e.target.matches('input[type="radio"]')) {
                const currentBlock = e.target.closest('.question-block');
                const nextBlock = currentBlock.nextElementSibling;
                
                if (nextBlock && nextBlock.classList.contains('question-block')) {
                    setTimeout(() => {
                        // 【關鍵優化】：計算下一題的位置並減去標題高度
                        const headerOffset = 80; // 留給頂部標題的空間
                        const elementPosition = nextBlock.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: "smooth"
                        });
                    }, 400);
                } else {
                    // 如果沒有下一題，滑到頁面底部
                    setTimeout(() => {
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    }, 400);
                }
            }
        });
    });

    // 4. 交卷算分與檢討
    function submitQuiz() {
        let score = 0;
        let reviewHtml = '<h4 class="mb-4 text-danger fw-bold">📝 錯題分析與檢討：</h4>';
        let wrongCount = 0;

        const pointPerQuestion = 100 / currentQuiz.length;

        currentQuiz.forEach((q, index) => {
            const selectedOption = document.querySelector(`input[name="q-${index}"]:checked`);
            const userAnswer = selectedOption ? selectedOption.value : "未作答";

            if (userAnswer === q.answer) {
                score += pointPerQuestion;
            } else {
                wrongCount++;
                reviewHtml += `
                    <div class="alert alert-danger shadow-sm mb-4 border-0 border-start border-danger border-5 p-3 p-md-4">
                        <div class="text-muted small mb-2">來源：${q.topic} (原題號：${q.id})</div>
                        <h5 class="fw-bold text-dark mb-4 lh-base">${q.question}</h5>
                        <div class="mb-2 fs-5"><span class="wrong-ans">❌ 你的答案：${userAnswer}</span></div>
                        <div class="fs-5"><span class="correct-ans">✅ 正確答案：${q.answer}</span></div>
                    </div>
                `;
            }
        });

        document.getElementById('quiz-section').classList.add('d-none');
        document.getElementById('result-section').classList.remove('d-none');

        document.getElementById('score-display').innerHTML = `您的總分是：<br><span class="${score >= 60 ? 'text-success' : 'text-danger'} display-1 fw-bold">${Math.round(score)}</span> <span class="fs-3">分</span>`;
        
        if (wrongCount === 0) {
            document.getElementById('review-container').innerHTML = '<div class="alert alert-success fs-4 shadow-sm text-center py-5">🎉 太棒了！全對！無錯題需要檢討。</div>';
        } else {
            document.getElementById('review-container').innerHTML = reviewHtml;
        }
        
        setTimeout(() => { window.scrollTo(0, 0); }, 50); 
    }
</script>
</body>
</html>
